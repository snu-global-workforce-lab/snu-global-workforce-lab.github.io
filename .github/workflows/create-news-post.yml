name: Create news post

on:
  workflow_dispatch:
    inputs:
      title:
        description: "News title"
        required: true
        type: string
      date:
        description: "Publication date, YYYY-MM-DD"
        required: true
        type: string
      excerpt:
        description: "Short summary shown on the news page"
        required: false
        type: string
      categories:
        description: "Comma-separated categories. news is added automatically."
        required: false
        default: "news"
        type: string
      teaser_image:
        description: "Image path, for example /images/news/example.jpeg"
        required: false
        type: string
      body:
        description: "Main post body in Markdown or HTML"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create post file
        env:
          NEWS_TITLE: ${{ inputs.title }}
          NEWS_DATE: ${{ inputs.date }}
          NEWS_EXCERPT: ${{ inputs.excerpt }}
          NEWS_CATEGORIES: ${{ inputs.categories }}
          NEWS_TEASER_IMAGE: ${{ inputs.teaser_image }}
          NEWS_BODY: ${{ inputs.body }}
        run: python tools/create_news_post.py

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Add news post"
          git push
