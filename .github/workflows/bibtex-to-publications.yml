name: Update publications from BibTeX

on:
  workflow_dispatch:
  push:
    paths:
      - "_data/scholar.bib"
      - "tools/bib2pubmd.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate _publications from scholar.bib
        run: python tools/bib2pubmd.py

      - name: Commit generated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications
          git commit -m "Auto-update publications from scholar.bib" || echo "No changes"
          git push
